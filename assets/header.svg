<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="900" height="200">
  <!-- ============================================================
       Header: "Unlimited Blade Works" — campo de lâminas
       Paleta: dourado (Saber) #C5A028 / vermelho (Archer) #8B0000
       Feito à mão (sem imagens pesadas). ~4KB.
       ============================================================ -->
  <defs>
    <clipPath id="frame">
      <rect width="900" height="200"/>
    </clipPath>

    <!-- Brilho dourado atrás do nome -->
    <radialGradient id="glow" cx="50%" cy="42%" r="55%">
      <stop offset="0%"  stop-color="#C5A028" stop-opacity="0.28"/>
      <stop offset="55%" stop-color="#8B0000" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>

    <!-- Chão em brasa -->
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#8B0000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#8B0000" stop-opacity="0.22"/>
    </linearGradient>
  </defs>

  <style>
    .ember { animation: rise 6s linear infinite; }
    @keyframes rise {
      0%   { transform: translateY(0); opacity: 0; }
      15%  { opacity: 0.9; }
      100% { transform: translateY(-150px); opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .ember { animation: none; }
    }
  </style>

  <rect width="900" height="200" fill="#0d1117"/>
  <rect width="900" height="200" fill="url(#glow)"/>

  <g clip-path="url(#frame)">

    <!-- Linha do horizonte -->
    <line x1="0" y1="150" x2="900" y2="150" stroke="#2A2D3E" stroke-width="1"/>
    <rect y="150" width="900" height="50" fill="url(#ground)"/>

    <!-- Brasas subindo -->
    <g fill="#C5A028">
      <circle class="ember" cx="180" cy="170" r="1.6" style="animation-delay:0s"/>
      <circle class="ember" cx="320" cy="180" r="1.2" style="animation-delay:2s"/>
      <circle class="ember" cx="470" cy="175" r="1.8" style="animation-delay:3.5s"/>
      <circle class="ember" cx="610" cy="182" r="1.3" style="animation-delay:1s"/>
      <circle class="ember" cx="720" cy="172" r="1.6" style="animation-delay:4.2s"/>
    </g>
    <g fill="#8B0000">
      <circle class="ember" cx="250" cy="178" r="1.5" style="animation-delay:2.8s"/>
      <circle class="ember" cx="540" cy="176" r="1.4" style="animation-delay:0.6s"/>
      <circle class="ember" cx="660" cy="184" r="1.6" style="animation-delay:5s"/>
    </g>

  </g>

  <!-- Cântico / subtítulo -->
  <text x="450" y="98"
    font-family="'Cinzel', Georgia, serif"
    font-size="34" font-weight="600" letter-spacing="0.16em"
    fill="#E8C45A" text-anchor="middle">I AM THE BONE OF MY CODE</text>

  <!-- Handle -->
  <text x="450" y="134"
    font-family="system-ui, 'Segoe UI', Helvetica, Arial, sans-serif"
    font-size="20" font-weight="500" letter-spacing="0.08em"
    fill="#C5A028" text-anchor="middle" opacity="0.9">@Italo-Fernando</text>
</svg>
